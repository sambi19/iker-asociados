<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Iker &amp; Asociados">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c368"/>
      <stop offset=".5" stop-color="#c9a227"/>
      <stop offset="1" stop-color="#8d701a"/>
    </linearGradient>
    <linearGradient id="n" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2f66"/>
      <stop offset="1" stop-color="#0a1530"/>
    </linearGradient>
  </defs>

  <!-- arco -->
  <path d="M22 66a38 38 0 0 1 76 0" fill="none" stroke="url(#g)" stroke-width="6" stroke-linecap="round"/>

  <!-- balanza (izquierda) -->
  <g stroke="url(#g)" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M32 44v34"/>
    <path d="M22 50h20"/>
    <path d="M24 50l-3 8M40 50l3 8"/>
  </g>
  <path d="M15 58h12l-6 7z" fill="url(#g)"/>
  <path d="M37 58h12l-6 7z" fill="url(#g)"/>

  <!-- columna (derecha) -->
  <g fill="url(#n)">
    <rect x="80" y="46" width="18" height="5" rx="1.5"/>
    <rect x="83" y="51" width="12" height="26"/>
    <rect x="79" y="77" width="20" height="5" rx="1.5"/>
  </g>
  <circle cx="83.5" cy="48.5" r="2.4" fill="url(#g)"/>
  <circle cx="94.5" cy="48.5" r="2.4" fill="url(#g)"/>

  <!-- monograma I & A -->
  <g font-family="Georgia,'Times New Roman',serif" font-weight="700" text-anchor="middle">
    <text x="50" y="76" font-size="46" fill="url(#n)">I</text>
    <text x="72" y="76" font-size="46" fill="url(#g)">A</text>
    <text x="61" y="74" font-size="20" fill="url(#g)">&amp;</text>
  </g>

  <!-- libro abierto -->
  <path d="M18 88c14-6 26-6 42 2 16-8 28-8 42-2l-6 10c-13-5-24-5-36 2-12-7-23-7-36-2z" fill="url(#n)"/>
  <path d="M60 90v12" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
